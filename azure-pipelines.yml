trigger:
  branches:
    include:
      - main

pr: none

variables:
  azureSubscription: 'camps-connection'   # <-- exact name from Project settings -> Service connections
  webAppName: 'camps'
  nodeVersion: '22.x'
  runtimeStack: 'NODE|22-lts'
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImage)
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint --if-present
            displayName: 'Lint'
            continueOnError: true

          - script: npm run build
            displayName: 'Build'
            env:
              NEXT_TELEMETRY_DISABLED: 1
              # Any NEXT_PUBLIC_* variables go here, mapped from pipeline variables, e.g.:
              # NEXT_PUBLIC_API_BASE_URL: $(NEXT_PUBLIC_API_BASE_URL)

          - script: |
              cp -r public .next/standalone/public
              cp -r .next/static .next/standalone/.next/static
              # Files the app may read from disk at runtime
              [ -d data ] && cp -r data .next/standalone/data
              cp *.xlsx .next/standalone/ 2>/dev/null || true
            displayName: 'Prepare standalone output'

          - task: ArchiveFiles@2
            displayName: 'Zip app'
            inputs:
              rootFolderOrFile: '.next/standalone'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/release.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/release.zip'
              artifact: 'drop'

  - stage: Deploy
    displayName: Deploy to camps
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        environment: 'production'
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/release.zip'
                    runtimeStack: $(runtimeStack)
                    startUpCommand: 'node server.js'
                    appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false'